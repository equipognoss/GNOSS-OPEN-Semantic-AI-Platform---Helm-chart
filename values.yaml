global:
  ##############################
  storageClassName: "csi-cephfs-sc"
  hosts:
    services: ""
    web: ""
  basicAuth: false

########## SECRETS ###########
secrets:
  sql:
    name: sql-secret
    acid:  
      secretKey: acidConnectionString
    base:
      secretKey: baseConnectionString
    oauth:
      secretKey: oauthConnectionString
  virtuoso:
    name: virtuoso-secret
    read:
      secretKey: virtuosoRead
    readHome:
      secretKey: virtuosoReadHome    
    writeHome:
      secretKey: virtuosoWriteHome
    write1:
      secretKey: virtuosoWrite1
    write2:
      secretKey: virtuosoWrite2
  rabbitmq:
    name: rabbitmq-secret
    connectionString:
      secretKey: rabbitMQConnectionString
  identity:
    name: identity-secret
    scope: 
      secretKey: scope
    clientID: 
      secretKey: clientID
    clientSecret:
      secretKey: clientSecret
  tls:
    secretName: tls-secret
  basicAuth:
    name: basic-auth-secret

################################
#                              #
#    VALUES PARA LOS INGRESS   #
#                              #
################################
ingress:
  https: true
  schema_servicios: "https"
  forwardedheaders: true

###########################
#                         #
#    VALUES COMUNES       #
#                         #
###########################
general:
  tag: "6.1.19"
  extraTolerations: null
  # extraTolerations will be appended to service specific tolerations
  # extraTolerations:
  #   - key: "team"
  #     operator: "Equal"
  #     value: "gnoss"
  #     effect: "NoSchedule"
  extraAffinity: null
  # extraAffinity will be merged with service specific affinity
  # extraAffinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #       - matchExpressions:
  #         - key: kubernetes.io/hostname
  #           operator: NotIn
  #           values:
  #           - master0
  #           - master1
  #           - master2
  imagePullSecrets: null
  user: 2000
  group: 2000
  connectionType: "2"
  language: "es|Español,en|English,ca|Català,eu|Euskara,gl|Galego"
  replicacionActivada: true
  replicacionActivadaHome: true
  apiPort: 8080
  managementPort: 8081
  healthChecksEnabled: true

######################################
