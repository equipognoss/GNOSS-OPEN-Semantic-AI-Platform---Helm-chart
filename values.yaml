web:
  replicas: 1
  image: "gnoss/gnoss.web.opencore"
  tag: ""
  pullPolicy: IfNotPresent
  limitsEnabled: true
  limitMemory: 6000Mi
  limitCpu: 4
  requestMemory: 300Mi
  requestCpu: 200m
  restartPolicy: Always
  tolerations: null
  affinity: null
  logLevel:
    default: "Information"
    overrides:
      "Microsoft": "Warning"
      "Microsoft.Hosting.Lifetime": "Information"
      "Microsoft.AspNetCore.Hosting.Diagnostics": "Warning"
  robotsTxt: |
    User-agent: *
    Disallow: /

