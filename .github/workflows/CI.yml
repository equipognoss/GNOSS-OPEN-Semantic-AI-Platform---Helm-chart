name: Helm CI/CD

on:
  pull_request:
    branches:
      - "**"

jobs:
  helm_lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      CHART_PATH: "."
      HELM_STRICT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Validar Helm Chart
        run: |
          echo "==> Validando Helm Chart en: $CHART_PATH"
          helm version

          # Lint básico
          if [ "$HELM_STRICT" = "true" ]; then
            helm lint "$CHART_PATH" --strict
          else
            helm lint "$CHART_PATH"
          fi

          # Verificar que los templates renderizan correctamente
          echo "==> Verificando render de templates..."
          helm template release-test "$CHART_PATH" > /dev/null

          echo "Helm lint completado con éxito"