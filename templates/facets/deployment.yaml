#############
#           #
#  FACETAS  #
#           #
#############
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: facetas
  name: facetas
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.facetas.replicas }}
  selector:
    matchLabels:
      app: facetas
  template:
    metadata:
      labels:
        app: facetas
    spec:
      {{ if or (.Values.facetas.tolerations) (.Values.general.extraTolerations) }}
      tolerations:
      {{- with .Values.facetas.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.general.extraTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $cacheAffinity := default dict .Values.facetas.affinity }}
      {{- $extraAffinity := default dict .Values.general.extraAffinity }}
      {{- $mergedAffinity := merge $cacheAffinity $extraAffinity }}
      {{- if $mergedAffinity }}
      affinity:
      {{ toYaml $mergedAffinity | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: facetas
        image: {{ printf "%s:%s" .Values.facetas.image (default .Values.general.tag .Values.facetas.tag) }}
        imagePullPolicy: {{ .Values.facetas.pullPolicy }}
        {{- if .Values.facetas.limitsEnabled | quote }}
        resources:
          limits:
            memory: {{ .Values.facetas.limitMemory }}
            cpu: {{ .Values.facetas.limitCpu }}
          requests:
            memory: {{ .Values.facetas.requestMemory }}
            cpu: {{ .Values.facetas.requestCpu }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: config-gnoss-core
        env:
        - name: acid
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.acid.secretKey }}
        - name: base
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.base.secretKey }}
        - name: virtuosoConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.read.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso1
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write1.secretKey }}
        ports:
        - name: "port-facetas"
          containerPort: {{ .Values.general.apiPort }}
          protocol: TCP
        - name: "management-port"
          containerPort: {{ .Values.general.managementPort }}
          protocol: TCP
        {{- if .Values.general.healthChecksEnabled }}
        livenessProbe:
          httpGet:
            path: /health/live
            port: {{ .Values.general.managementPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: {{ .Values.general.managementPort }}
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3
        {{- end }}
        volumeMounts:
        - name: logs-config
          mountPath: /app/logging-config
      volumes:
        - name: logs-config
          configMap:
            name: facetas
      restartPolicy: {{ .Values.facetas.restartPolicy }}
      {{- if .Values.global.serviceAccountName }}
      serviceAccountName: {{  .Values.global.serviceAccountName | quote }}
      {{- end }}
      {{- with .Values.general.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}