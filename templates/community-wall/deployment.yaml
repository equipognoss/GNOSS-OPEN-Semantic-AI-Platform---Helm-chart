###################
#  COMMUNITYWALL  #
###################
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: communitywall
  name: communitywall
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.generalBack.replicas }}
  selector:
    matchLabels:
      app: communitywall
  template:
    metadata:
      labels:
        app: communitywall
    spec:
      {{ if or (.Values.communitywall.tolerations) (.Values.general.extraTolerations) }}
      tolerations:
      {{- with .Values.communitywall.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.general.extraTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $cacheAffinity := default dict .Values.communitywall.affinity }}
      {{- $extraAffinity := default dict .Values.general.extraAffinity }}
      {{- $mergedAffinity := merge $cacheAffinity $extraAffinity }}
      {{- if $mergedAffinity }}
      affinity:
      {{ toYaml $mergedAffinity | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      {{- if .Values.global.serviceAccountName }}
      serviceAccountName: {{  .Values.global.serviceAccountName | quote }}
      {{- end }}
      {{- with .Values.general.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: communitywall
        image: {{ printf "%s:%s" .Values.communitywall.image .Values.communitywall.tag }}
        imagePullPolicy: {{ .Values.generalBack.pullPolicy }}
        {{- if .Values.communitywall.limitsEnabled | quote }}
        resources:
          limits:
            memory: {{ .Values.communitywall.limitMemory }}
            cpu: {{ .Values.communitywall.limitCpu }}
          requests:
            memory: {{ .Values.communitywall.requestMemory }}
            cpu: {{ .Values.communitywall.requestCpu }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: config-gnoss-core
        env:
        - name: acid
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.acid.secretKey }}
        - name: base
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.base.secretKey }}
        - name: virtuosoConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.read.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso1
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write1.secretKey }}
        - name: RabbitMQ__colaServiciosWin
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.rabbitmq.name }}
              key: {{ .Values.secrets.rabbitmq.connectionString.secretKey }}
        - name: RabbitMQ__colaReplicacion
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.rabbitmq.name }}
              key: {{ .Values.secrets.rabbitmq.connectionString.secretKey }}
        - name: intervalo
          value: "100"