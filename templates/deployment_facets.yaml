#############
#           #
#  FACETAS  #
#           #
#############
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: facetas
  name: facetas
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.facetas.replicas }}
  selector:
    matchLabels:
      app: facetas
  template:
    metadata:
      labels:
        app: facetas
    spec:
      {{ if or (.Values.facetas.tolerations) (.Values.general.extraTolerations) }}
      tolerations:
      {{- with .Values.facetas.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.general.extraTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $cacheAffinity := default dict .Values.facetas.affinity }}
      {{- $extraAffinity := default dict .Values.general.extraAffinity }}
      {{- $mergedAffinity := merge $cacheAffinity $extraAffinity }}
      {{- if $mergedAffinity }}
      affinity:
      {{ toYaml $mergedAffinity | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: facetas
        image: "{{ .Values.facetas.image}}:{{ .Values.facetas.tag }}"
        imagePullPolicy: "{{ .Values.facetas.pullPolicy }}"
        {{- if .Values.facetas.limitsEnabled }}
        resources:
          limits:
            memory: {{ .Values.facetas.limitMemory }}
            cpu: {{ .Values.facetas.limitCpu }}
          requests:
            memory: {{ .Values.facetas.requestMemory }}
            cpu: {{ .Values.facetas.requestCpu }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: config-gnoss-core
        env:
        - name: acid
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.acid.secretKey }}
        - name: base
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.base.secretKey }}
        - name: virtuosoConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.read.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso1
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write1.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso2
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write2.secretKey }}
        - name: Servicios__urlBase
          value: "{{ .Values.ingress.schema_servicios }}://{{ .Values.ingress.hostServicios }}"
        ports:
        - name: "port-facetas"
          containerPort: 8080
          protocol: TCP
      restartPolicy: {{ .Values.facetas.restartPolicy }}
      {{- if .Values.global.serviceAccount }}
      serviceAccount: "{{ .Values.global.serviceAccount}}"
      {{- end }}
      {{- with .Values.general.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}