#########
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web
  name: web
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      {{ if or (.Values.web.tolerations) (.Values.general.extraTolerations) }}
      tolerations:
      {{- with .Values.web.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.general.extraTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $cacheAffinity := default dict .Values.web.affinity }}
      {{- $extraAffinity := default dict .Values.general.extraAffinity }}
      {{- $mergedAffinity := merge $cacheAffinity $extraAffinity }}
      {{- if $mergedAffinity }}
      affinity:
      {{ toYaml $mergedAffinity | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: web
        image: {{ printf "%s:%s" .Values.web.image (default .Values.general.tag .Values.web.tag) }}
        imagePullPolicy: {{ .Values.web.pullPolicy }}
        {{- if .Values.web.limitsEnabled | quote }}
        resources:
          limits:
            memory: {{ .Values.web.limitMemory }}
            cpu: {{ .Values.web.limitCpu }}
          requests:
            memory: {{ .Values.web.requestMemory }}
            cpu: {{ .Values.web.requestCpu }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: config-gnoss-core
        env:
        - name: acid
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.acid.secretKey }}
        - name: base
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.base.secretKey }}
        - name: oauth
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.oauth.secretKey }}
        - name: virtuosoConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.read.secretKey }}
        - name: virtuosoConnectionString_home
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.readHome.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso1
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write1.secretKey }}
        - name: RabbitMQ__colaServiciosWin
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.rabbitmq.name }}
              key: {{ .Values.secrets.rabbitmq.connectionString.secretKey }}
        - name: RabbitMQ__colaReplicacion
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.rabbitmq.name }}
              key: {{ .Values.secrets.rabbitmq.connectionString.secretKey }}
        - name: scopeIdentity
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.identity.name }}
              key: {{ .Values.secrets.identity.scope.secretKey }}
        - name: clientIDIdentity
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.identity.name }}
              key: {{ .Values.secrets.identity.clientID.secretKey }}
        - name: clientSecretIdentity
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.identity.name }}
              key: {{ .Values.secrets.identity.clientSecret.secretKey }}
        - name: intervalo
          value: "100"
        - name: Servicios__urlStatic
          value: {{ printf "%s://%s" .Values.ingress.schema_servicios .Values.global.hosts.web }}
        - name: Servicios__contextosHome
          value: {{ printf "%s://%s/resultados/CargadorContextoMensajes" .Values.ingress.schema_servicios .Values.global.hosts.services }}
        - name: Servicios__etiquetadoAutomatico
          value: {{ printf "%s://%s/autocompletaretiquetas/EtiquetadoAutomatico" .Values.ingress.schema_servicios .Values.global.hosts.services }}
        - name: dominio
          value: {{ .Values.global.hosts.web }}
        ports:
        - name: "port-web"
          containerPort: 8080
          protocol: TCP
        volumeMounts:
          - name: robotstxt
            mountPath: /app/wwwroot/robots.txt
            subPath: robots.txt
          - name: logs-config
            mountPath: /app/logging-config
      volumes:
        - name: robotstxt
          configMap:
            name: robotstxt-config
            items:
              - key: robots.txt
                path: robots.txt
        - name: logs-config
          configMap:
            name: web
      restartPolicy: {{ .Values.web.restartPolicy }}
      {{- if .Values.global.serviceAccountName }}
      serviceAccountName: {{  .Values.global.serviceAccountName | quote }}
      {{- end }}
      {{- with .Values.general.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}