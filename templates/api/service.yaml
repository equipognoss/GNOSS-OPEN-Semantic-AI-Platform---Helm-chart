{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    servicio: api
  namespace: {{ .Release.Namespace | quote }}
spec:
  ports:
    - name: "port-api"
      protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: api
status:
  loadBalancer: {}
{{- end }}