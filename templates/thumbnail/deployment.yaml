#########################
#  THUMBNAILGENERATOR   #
#########################
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: thumbnailgenerator
  name: thumbnailgenerator
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.generalBack.replicas }}
  selector:
    matchLabels:
      app: thumbnailgenerator
  template:
    metadata:
      labels:
        app: thumbnailgenerator
    spec:
      {{ if or (.Values.thumbnailgenerator.tolerations) (.Values.general.extraTolerations) }}
      tolerations:
      {{- with .Values.thumbnailgenerator.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.general.extraTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $cacheAffinity := default dict .Values.thumbnailgenerator.affinity }}
      {{- $extraAffinity := default dict .Values.general.extraAffinity }}
      {{- $mergedAffinity := merge $cacheAffinity $extraAffinity }}
      {{- if $mergedAffinity }}
      affinity:
      {{ toYaml $mergedAffinity | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      {{- if .Values.global.serviceAccountName }}
      serviceAccountName: {{  .Values.global.serviceAccountName | quote }}
      {{- end }}
      {{- with .Values.general.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: thumbnailgenerator
        image: {{ printf "%s:%s" .Values.thumbnailgenerator.image .Values.thumbnailgenerator.tag }}
        imagePullPolicy: {{ .Values.generalBack.pullPolicy }}
        {{- if .Values.thumbnailgenerator.limitsEnabled | quote }}
        resources:
          limits:
            memory: {{ .Values.thumbnailgenerator.limitMemory }}
            cpu: {{ .Values.thumbnailgenerator.limitCpu }}
          requests:
            memory: {{ .Values.thumbnailgenerator.requestMemory }}
            cpu: {{ .Values.thumbnailgenerator.requestCpu }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: config-gnoss-core
        env:
        - name: acid
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.acid.secretKey }}
        - name: base
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.base.secretKey }}
        - name: virtuosoConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.read.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso1
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write1.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso2
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write2.secretKey }}
        - name: RabbitMQ__colaServiciosWin
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.rabbitmq.name }}
              key: {{ .Values.secrets.rabbitmq.connectionString.secretKey }}
        - name: RabbitMQ__colaReplicacion
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.rabbitmq.name }}
              key: {{ .Values.secrets.rabbitmq.connectionString.secretKey }}
        - name: scopeIdentity
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.identity.name }}
              key: {{ .Values.secrets.identity.scope.secretKey }}
        - name: clientIDIdentity
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.identity.name }}
              key: {{ .Values.secrets.identity.clientID.secretKey }}
        - name: clientSecretIdentity
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.identity.name }}
              key: {{ .Values.secrets.identity.clientSecret.secretKey }}
        - name: intervalo
          value: "100"