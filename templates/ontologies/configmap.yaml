apiVersion: v1
kind: ConfigMap
metadata:
  name: ontologias
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Error"
        }
      },
      "Serilog": {
        "MinimumLevel": {
          "Default": {{ .Values.ontologias.logLevel.default | quote }},
          "Override": {
            {{- $first := true }}
            {{- range $namespace, $level := .Values.ontologias.logLevel.overrides }}
            {{- if not $first }},{{ end }}
            {{ $namespace | quote }}: {{ $level | quote }}
            {{- $first = false }}
            {{- end }}
          }
        }
      }
    }