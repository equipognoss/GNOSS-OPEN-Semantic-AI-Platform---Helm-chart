
# Web 
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gnoss-web-routes
  namespace: {{ .Release.Namespace | quote }}
spec:
  parentRefs:
  - name: gnoss-gateway
    namespace: {{ .Release.Namespace | quote }}
    sectionName: {{ if .Values.ingress.https }}https{{ else }}http{{ end }}
  hostnames:
  - {{ .Values.ingress.hostWeb }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: web
      port: 8080