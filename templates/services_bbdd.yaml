apiVersion: v1
kind: Service
metadata:
  name: "postgres"
  namespace: {{ .Values.global.namespace }}
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
  - name: sql
    protocol: TCP
    port: 5432
    targetPort: 5432
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: virtuoso
  namespace: {{ .Values.global.namespace }}
  labels:
    app: virtuoso
spec:
  type: ClusterIP
  ports:
  - name: sparql
    protocol: TCP
    port: 8890
    targetPort: 8890
  - name: isql
    protocol: TCP
    port: 1111
    targetPort: 1111
  selector:
    app.gnoss: virtuoso
---
apiVersion: v1
kind: Service
metadata:
  name: virtuoso1
  namespace: {{ .Values.global.namespace }}
