apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: visitcluster
  name: visitcluster
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.visitcluster.replicas }}
  selector:
    matchLabels:
      app: visitcluster
  template:
    metadata:
      labels:
        app: visitcluster
    spec:
      {{ if or (.Values.visitcluster.tolerations) (.Values.general.extraTolerations) }}
      tolerations:
      {{- with .Values.visitcluster.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.general.extraTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $cacheAffinity := default dict .Values.visitcluster.affinity }}
      {{- $extraAffinity := default dict .Values.general.extraAffinity }}
      {{- $mergedAffinity := merge $cacheAffinity $extraAffinity }}
      {{- if $mergedAffinity }}
      affinity:
      {{ toYaml $mergedAffinity | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: {{ .Values.general.user }}
        runAsGroup: {{ .Values.general.group }}
        fsGroup: {{ .Values.general.group }}
        fsGroupChangePolicy: OnRootMismatch
      {{- if .Values.global.serviceAccountName }}
      serviceAccountName: {{  .Values.global.serviceAccountName | quote }}
      {{- end }}
      {{- with .Values.general.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: visitcluster
        image: {{ printf "%s:%s" .Values.visitcluster.image (default .Values.general.tag .Values.visitcluster.tag) }}
        imagePullPolicy: {{ .Values.generalBack.pullPolicy }}
        {{- if .Values.visitcluster.limitsEnabled | quote }}
        resources:
          limits:
            memory: {{ .Values.visitcluster.limitMemory }}
            cpu: {{ .Values.visitcluster.limitCpu }}
          requests:
            memory: {{ .Values.visitcluster.requestMemory }}
            cpu: {{ .Values.visitcluster.requestCpu }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: config-gnoss-core
        env:
        - name: acid
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.acid.secretKey }}
        - name: base
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.base.secretKey }}
        - name: virtuosoConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.read.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso1
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write1.secretKey }}
        - name: RabbitMQ__colaServiciosWin
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.rabbitmq.name }}
              key: {{ .Values.secrets.rabbitmq.connectionString.secretKey }}
        - name: RabbitMQ__colaReplicacion
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.rabbitmq.name }}
              key: {{ .Values.secrets.rabbitmq.connectionString.secretKey }}
        - name: intervalo
          value: "100"
        volumeMounts:
        - name: logs-config
          mountPath: /app/logging-config
      volumes:
        - name: logs-config
          configMap:
            name: visitcluster
  volumeClaimTemplates:
  - metadata:
      name: {{ include "gnoss.persistentVolumeName" . }}
      namespace: {{ .Release.Namespace | quote }}
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.global.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.visitcluster.espacioVol }}