apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: interno
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: interno
spec:

  replicas: {{ .Values.interno.replicas }}
  serviceName: "interno"
  selector:
    matchLabels:
      app: interno
  template:
    metadata:
      labels:
        app: interno
    spec:
      {{ if or (.Values.interno.tolerations) (.Values.general.extraTolerations) }}
      tolerations:
      {{- with .Values.interno.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.general.extraTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $cacheAffinity := default dict .Values.interno.affinity }}
      {{- $extraAffinity := default dict .Values.general.extraAffinity }}
      {{- $mergedAffinity := merge $cacheAffinity $extraAffinity }}
      {{- if $mergedAffinity }}
      affinity:
      {{ toYaml $mergedAffinity | nindent 8 }}
      {{- end }}
      securityContext:
      #  runAsUser: 1000
      #  allowPrivilegeEscalation: false
        fsGroupChangePolicy: OnRootMismatch
      securityContext:
        runAsUser: {{ .Values.general.user }}
        runAsGroup: {{ .Values.general.group }}
        fsGroup: {{ .Values.general.group }}
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: interno
        image: {{ printf "%s:%s" .Values.interno.image .Values.interno.tag }}
        imagePullPolicy: {{ .Values.generalstatefulset.pullPolicy }}
        {{- if .Values.interno.limitsEnabled | quote }}
        resources:
          limits:
            memory: {{ .Values.interno.limitMemory }}
            cpu: {{ .Values.interno.limitCpu }}
          requests:
            memory: {{ .Values.interno.requestMemory }}
            cpu: {{ .Values.interno.requestCpu }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: config-gnoss-core
        env:
        - name: acid
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.acid.secretKey }}
        - name: base
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.base.secretKey }}
        - name: virtuosoConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.read.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso1
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write1.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso2
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write2.secretKey }}
        - name: Servicios__urlBase
          value: {{ printf "%s://%s" .Values.ingress.schema_servicios .Values.global.hosts.services }}
        ports:
        - name: "port-int-8080"
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: {{ include "gnoss.persistentVolumeName" . }}
          mountPath: /app/doclinks
          subPath: doclinks
        - name: {{ include "gnoss.persistentVolumeName" . }}
          mountPath: /app/imagenes
          subPath: imagenes
        - name: {{ include "gnoss.persistentVolumeName" . }}
          mountPath: /app/ImagenesEnlaces
          subPath: ImagenesEnlaces
        - name: {{ include "gnoss.persistentVolumeName" . }}
          mountPath: /app/Videos
          subPath: Videos
      {{- if .Values.global.serviceAccountName }}
      serviceAccountName: {{  .Values.global.serviceAccountName | quote }}
      {{- end }}
      {{- with .Values.general.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: {{ include "gnoss.persistentVolumeName" . }}
      namespace: {{ .Release.Namespace | quote }}
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.global.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.interno.espacioVol }}
