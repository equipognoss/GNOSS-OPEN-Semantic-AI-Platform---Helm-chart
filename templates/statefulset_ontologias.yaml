apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ontologias 
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ontologias 
spec:
  replicas: {{ .Values.ontologias.replicas }}
  serviceName: "prado-gnoss"
  selector:
    matchLabels:
      app: ontologias 
  template:
    metadata:
      labels:
        app: ontologias 
    spec:
      {{ if or (.Values.ontologias.tolerations) (.Values.general.extraTolerations) }}
      tolerations:
      {{- with .Values.ontologias.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.general.extraTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $cacheAffinity := default dict .Values.ontologias.affinity }}
      {{- $extraAffinity := default dict .Values.general.extraAffinity }}
      {{- $mergedAffinity := merge $cacheAffinity $extraAffinity }}
      {{- if $mergedAffinity }}
      affinity:
      {{ toYaml $mergedAffinity | nindent 8 }}
      {{- end }}
      securityContext:
      #  runAsUser: 1000 #{{ .Values.global.PVusuario }}
      #  allowPrivilegeEscalation: false
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: volumepermissions
          image: busybox
          command:
            - sh
            - '-c'
            - |
              chmod -R 777 /app/Ontologias

              echo 'Volume permissions OK'
          resources: {}
          volumeMounts:
            - name: vol-gnoss
              mountPath: /app/Ontologias
              subPath: ontologias
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      containers:
      - name: ontologias 
        image: "{{ .Values.ontologias.image}}:{{ .Values.ontologias.tag }}"
        imagePullPolicy: "{{ .Values.generalstatefulset.pullPolicy }}"
        {{- if .Values.ontologias.limitsEnabled }}
        resources:
          limits:
            memory: {{ .Values.ontologias.limitMemory }}
            cpu: {{ .Values.ontologias.limitCpu }}
          requests:
            memory: {{ .Values.ontologias.requestMemory }}
            cpu: {{ .Values.ontologias.requestCpu }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: config-gnoss-core
        env:
        - name: acid
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.acid.secretKey }}
        - name: base
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.base.secretKey }}
        - name: virtuosoConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.read.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso1
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write1.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso2
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write2.secretKey }}
        - name: Servicios__urlBase
          value: "{{ .Values.ingress.schema_servicios }}://{{ .Values.ingress.hostServicios }}"
        - name: rutaOntologias
          value: "Ontologias/Archivos"
        ports:
        - name: "port-ontologias"
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: vol-gnoss
          mountPath: /app/Ontologias
          subPath: ontologias
      {{- if .Values.global.serviceAccount }}
      serviceAccount: "{{ .Values.global.serviceAccount}}"
      {{- end }}
      {{- with .Values.general.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: vol-gnoss
      namespace: "{{ .Values.global.namespace }}"
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "{{ .Values.global.storageClassName }}"
      resources:
        requests:
          storage: {{ .Values.ontologias.espacioVol }}
