{{- if .Values.login.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: login
  labels:
    servicio: login
  namespace: {{ .Release.Namespace | quote }}
spec:
  ports:
    - name: "port-login"
      protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: login
status:
  loadBalancer: {}
{{- end }}