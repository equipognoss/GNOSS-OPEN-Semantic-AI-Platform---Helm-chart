{{- if .Values.documents.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: documents
  labels:
    servicio: documents
  namespace: {{ .Release.Namespace | quote }}
spec:
  type: NodePort
  ports:
    - name: "port-document"
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: {{ .Values.documents.debugNodePort }}
  selector:
    app: documents
status:
  loadBalancer: {}
{{- end }}