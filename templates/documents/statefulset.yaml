apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: documents
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: documents
spec:
  replicas: {{ .Values.documents.replicas }}
  serviceName: "documents"
  selector:
    matchLabels:
      app: documents
  template:
    metadata:
      labels:
        app: documents
    spec:
      {{ if or (.Values.documents.tolerations) (.Values.general.extraTolerations) }}
      tolerations:
      {{- with .Values.documents.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.general.extraTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $cacheAffinity := default dict .Values.documents.affinity }}
      {{- $extraAffinity := default dict .Values.general.extraAffinity }}
      {{- $mergedAffinity := merge $cacheAffinity $extraAffinity }}
      {{- if $mergedAffinity }}
      affinity:
      {{ toYaml $mergedAffinity | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: {{ .Values.general.user }}
        runAsGroup: {{ .Values.general.group }}
        fsGroup: {{ .Values.general.group }}
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: documents
        image: {{ printf "%s:%s" .Values.documents.image .Values.documents.tag }}
        imagePullPolicy: {{ .Values.generalstatefulset.pullPolicy }}
        {{- if .Values.documents.limitsEnabled | quote }}
        resources:
          limits:
            memory: {{ .Values.documents.limitMemory }}
            cpu: {{ .Values.documents.limitCpu }}
          requests:
            memory: {{ .Values.documents.requestMemory }}
            cpu: {{ .Values.documents.requestCpu }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: config-gnoss-core
        env:
        - name: acid
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.acid.secretKey }}
        - name: base
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.base.secretKey }}
        - name: virtuosoConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.read.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso1
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write1.secretKey }}     
        - name: Servicios__urlBase
          value: {{ printf "%s://%s" .Values.ingress.schema_servicios .Values.global.hosts.services }}
        ports:
        - name: "port-document"
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: {{ include "gnoss.persistentVolumeName" . }}
          mountPath: /app/Documentacion
          subPath: documentacion
      {{- if .Values.global.serviceAccountName }}
      serviceAccountName: {{  .Values.global.serviceAccountName | quote }}
      {{- end }}
      {{- with .Values.general.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: {{ include "gnoss.persistentVolumeName" . }}
      namespace: {{ .Release.Namespace | quote }}
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.global.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.documents.espacioVol }}