#############
# WORKFLOWS #
#############
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: workflows
  name: workflows
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.generalBack.replicas }}
  selector:
    matchLabels:
      app: workflows
  template:
    metadata:
      labels:
        app: workflows
    spec:
      {{ if or (.Values.workflows.tolerations) (.Values.general.extraTolerations) }}
      tolerations:
      {{- with .Values.workflows.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.general.extraTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $cacheAffinity := default dict .Values.workflows.affinity }}
      {{- $extraAffinity := default dict .Values.general.extraAffinity }}
      {{- $mergedAffinity := merge $cacheAffinity $extraAffinity }}
      {{- if $mergedAffinity }}
      affinity:
      {{ toYaml $mergedAffinity | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      {{- if .Values.global.serviceAccount }}
      serviceAccount: "{{ .Values.global.serviceAccount}}"
      {{- end }}
      {{- with .Values.general.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: workflows
        image: "{{ .Values.workflows.image }}:{{ .Values.workflows.tag }}"
        imagePullPolicy: "{{ .Values.generalBack.pullPolicy }}"
        {{- if .Values.workflows.limitsEnabled }}
        resources:
          limits:
            memory: {{ .Values.workflows.limitMemory }}
            cpu: {{ .Values.workflows.limitCpu }}
          requests:
            memory: {{ .Values.workflows.requestMemory }}
            cpu: {{ .Values.workflows.requestCpu }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: config-gnoss-core
        env:
        - name: acid
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.acid.secretKey }}
        - name: base
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.base.secretKey }}
        - name: virtuosoConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.read.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso1
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write1.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso2
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write2.secretKey }}
        - name: RabbitMQ__colaServiciosWin
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.rabbitmq.name }}
              key: {{ .Values.secrets.rabbitmq.connectionString.secretKey }}
        - name: intervalo
          value: "100"