{{- if .Values.etiquetadoautomatico.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: etiquetadoautomatico
  labels:
    servicio: etiquetadoautomatico
  namespace: {{ .Release.Namespace | quote }}
spec:
  ports:
    - name: "port-etiquetado"
      protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: etiquetadoautomatico
status:
  loadBalancer: {}
{{- end }}