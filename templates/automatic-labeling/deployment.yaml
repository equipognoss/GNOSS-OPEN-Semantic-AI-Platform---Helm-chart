####################################
#  ETIQUETADOAUTOMATICO (LABELER)  #
####################################
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: etiquetadoautomatico
  name: etiquetadoautomatico
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.etiquetadoautomatico.replicas }}
  selector:
    matchLabels:
      app: etiquetadoautomatico
  template:
    metadata:
      labels:
        app: etiquetadoautomatico
    spec:
      {{ if or (.Values.etiquetadoautomatico.tolerations) (.Values.general.extraTolerations) }}
      tolerations:
      {{- with .Values.etiquetadoautomatico.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.general.extraTolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $cacheAffinity := default dict .Values.etiquetadoautomatico.affinity }}
      {{- $extraAffinity := default dict .Values.general.extraAffinity }}
      {{- $mergedAffinity := merge $cacheAffinity $extraAffinity }}
      {{- if $mergedAffinity }}
      affinity:
      {{ toYaml $mergedAffinity | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: etiquetadoautomatico
        image: {{ printf "%s:%s" .Values.etiquetadoautomatico.image (default .Values.general.tag .Values.etiquetadoautomatico.tag) }}
        imagePullPolicy: {{ .Values.etiquetadoautomatico.pullPolicy }}
        {{- if .Values.etiquetadoautomatico.limitsEnabled | quote }}
        resources:
          limits:
            memory: {{ .Values.etiquetadoautomatico.limitMemory }}
            cpu: {{ .Values.etiquetadoautomatico.limitCpu }}
          requests:
            memory: {{ .Values.etiquetadoautomatico.requestMemory }}
            cpu: {{ .Values.etiquetadoautomatico.requestCpu }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: config-gnoss-core
        env:
        - name: acid
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.acid.secretKey }}
        - name: base
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sql.name }}
              key: {{ .Values.secrets.sql.base.secretKey }}
        - name: virtuosoConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.read.secretKey }}
        - name: Virtuoso__Escritura__Virtuoso1
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.virtuoso.name }}
              key: {{ .Values.secrets.virtuoso.write1.secretKey }}
        - name: scopeIdentity
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.identity.name }}
              key: {{ .Values.secrets.identity.scope.secretKey }}
        - name: clientIDIdentity
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.identity.name }}
              key: {{ .Values.secrets.identity.clientID.secretKey }}
        - name: clientSecretIdentity
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.identity.name }}
              key: {{ .Values.secrets.identity.clientSecret.secretKey }}
        - name: Servicios__urlBase
          value: {{ printf "%s://%s" .Values.ingress.schema_servicios .Values.global.hosts.services }}
        ports:
        - name: "port-etiquetado"
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: logs-config
          mountPath: /app/logging-config
      volumes:
        - name: logs-config
          configMap:
            name: etiquetadoautomatico
      restartPolicy: {{ .Values.etiquetadoautomatico.restartPolicy }}
      {{- if .Values.global.serviceAccountName }}
      serviceAccountName: {{  .Values.global.serviceAccountName | quote }}
      {{- end }}
      {{- with .Values.general.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}